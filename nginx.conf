server {
    listen 80;
    server_name goldstroy.ru www.goldstroy.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name goldstroy.ru www.goldstroy.ru;

    ssl_certificate /etc/letsencrypt/live/goldstroy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/goldstroy.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/goldstroy/v2/dist/client;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
